"$schema" = 'https://starship.rs/config-schema.json'

# Switch the whole bar by changing this line:
# light:  mocha_storm | mocha_ember | mocha_forest | mocha_mauve
# darker: mocha_abyss (storm) | mocha_ember_dark | mocha_forest_dark | mocha_mauve_dark
palette = 'mocha_storm'

format = """
[░▒▓](color_cap)\
$os\
[](fg:color_cap bg:color_dir_bg)\
${custom.directory}\
[](fg:color_dir_bg bg:color_git_bg)\
$git_branch\
$git_status\
[](fg:color_git_bg bg:color_ctx_bg)\
$nodejs\
$zig\
$golang\
$rust\
$docker_context\
$terraform\
$pulumi\
$mise\
[](fg:color_ctx_bg bg:color_tail_bg)\
$status\
$time\
[ ](fg:color_tail_bg)\
\n$character"""

[os]
disabled = false
style = "bg:color_cap fg:color_cap_fg"
format = "[ $symbol ]($style)"
[os.symbols]
