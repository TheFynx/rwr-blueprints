DragonFly = " "
Elementary = " "
Emscripten = " "
EndeavourOS = " "
Fedora = " "
FreeBSD = " "
Garuda = " "
Gentoo = " "
HardenedBSD = "󰞌 "
Illumos = " "
InstantOS = " "
Ios = "󰀷 "
Kali = " "
Linux = " "
Mabox = " "
Macos = " "
Manjaro = " "
Mariner = " "
MidnightBSD = " "
Mint = " "
NetBSD = " "
NixOS = " "
Nobara = " "
OpenBSD = " "
OpenCloudOS = " "
openEuler = " "
openSUSE = " "
OracleLinux = "󰺡 "
PikaOS = " "
Pop = " "
Raspbian = " "
Redhat = "󱄛 "
RedHatEnterprise = "󱄛 "
Redox = "󰀘 "
RockyLinux = " "
Solus = " "
SUSE = " "
Ubuntu = " "
Ultramarine = " "
Unknown = " "
Uos = " "
Void = " "
Windows = "󰍲 "
Zorin = " "

[custom.directory]
# git rev-parse returns a physical path, so the prefix strip must compare against
# `pwd -P` - $PWD carries the shell's logical path, and through a symlinked repo
# parent the two never matched, appending the whole path to the formatted output.
# The ~ branch still uses logical $PWD so a symlinked home collapses to ~.
command = '''p=$(pwd -P); r=$(git rev-parse --show-toplevel 2>/dev/null); if [ -n "$r" ]; then printf '%s/%s%s' "$(basename "$(dirname "$r")")" "$(basename "$r")" "${p#"$r"}"; else l=${PWD:-$p}; case "$l" in "$HOME") printf '~';; "$HOME"/*) printf '~%s' "${l#"$HOME"}";; *) printf '%s' "$p";; esac; fi'''
when = "true"
shell = ["sh"]
style = "fg:color_dir_fg bg:color_dir_bg"
format = "[  $output ]($style)"

[git_branch]
symbol = ""
style = "bg:color_git_bg"
format = '[[ $symbol $branch ](fg:color_git_fg bg:color_git_bg)]($style)'

[git_status]
style = "bg:color_git_bg"
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕${ahead_count}/${behind_count} "
conflicted = "=${count} "
stashed = "*${count} "
deleted = "✘${count} "
renamed = "»${count} "
modified = "!${count} "
staged = "+${count} "
untracked = "?${count} "
format = '[[ ($all_status$ahead_behind)](fg:color_git_fg bg:color_git_bg)]($style)'

[nodejs]
symbol = ""
style = "bg:color_ctx_bg"
format = '[[ $symbol ($version) ](fg:color_ctx_fg bg:color_ctx_bg)]($style)'

[zig]
symbol = ""
style = "bg:color_ctx_bg"
format = '[[ $symbol ($version) ](fg:color_ctx_fg bg:color_ctx_bg)]($style)'

[golang]
symbol = ""
style = "bg:color_ctx_bg"
format = '[[ $symbol ($version) ](fg:color_ctx_fg bg:color_ctx_bg)]($style)'

[rust]
symbol = "󱘗"
style = "bg:color_ctx_bg"
format = '[[ $symbol ($version) ](fg:color_ctx_fg bg:color_ctx_bg)]($style)'

[docker_context]
symbol = ""
style = "bg:color_ctx_bg"
format = '[[ $symbol ($context) ](fg:color_ctx_fg bg:color_ctx_bg)]($style)'

[terraform]
symbol = ""
style = "bg:color_ctx_bg"
format = '[[ $symbol ($workspace) ](fg:color_ctx_fg bg:color_ctx_bg)]($style)'

[pulumi]
symbol = ""
style = "bg:color_ctx_bg"
format = '[[ $symbol ($stack) ](fg:color_ctx_fg bg:color_ctx_bg)]($style)'

[mise]
disabled = true
healthy_symbol = ""
unhealthy_symbol = "unhealthy"
style = "bg:color_ctx_bg"
format = '[[(  $health )](fg:color_ctx_fg bg:color_ctx_bg)]($style)'


[status]
disabled = false
symbol = " "
style = "bg:color_tail_bg"
format = '[[ $symbol$status ](fg:color_status_fg bg:color_tail_bg)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:color_tail_bg"
format = '[[  $time ](fg:color_tail_fg bg:color_tail_bg)]($style)'

